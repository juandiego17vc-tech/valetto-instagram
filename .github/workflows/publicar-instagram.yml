name: Publicar en Instagram

# Horarios (hora Argentina = UTC - 3):
#   10:52 vista previa educativo -> Telegram     11:52 publica educativo
#   17:52 vista previa reloj     -> Telegram     18:52 publica reloj
on:
  schedule:
    - cron: "52 13 * * *"
    - cron: "52 14 * * *"
    - cron: "52 20 * * *"
    - cron: "52 21 * * *"
  workflow_dispatch:
    inputs:
      tipo:
        description: "¿Qué?"
        type: choice
        options: [reloj, educativo]
        default: reloj
      accion:
        description: "¿Qué hacer?"
        type: choice
        options: [prueba, vista_previa, publicar]
        default: prueba

permissions:
  contents: write

concurrency: publicar-instagram

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Correr
        run: node publicar.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '8634273911' }}
          TIPO: ${{ github.event_name == 'workflow_dispatch' && inputs.tipo || ((github.event.schedule == '52 13 * * *' || github.event.schedule == '52 14 * * *') && 'educativo' || 'reloj') }}
          ACCION: ${{ github.event_name == 'workflow_dispatch' && inputs.accion || ((github.event.schedule == '52 13 * * *' || github.event.schedule == '52 20 * * *') && 'vista_previa' || 'publicar') }}

      - name: Guardar historial (para no repetir)
        run: |
          git config user.name "valetto-bot"
          git config user.email "valetto-bot@users.noreply.github.com"
          for f in posted.json posted-edu.json pendiente-reloj.json pendiente-educativo.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || (git commit -m "Publicación $(date +%F)" && git pull --rebase && git push)
