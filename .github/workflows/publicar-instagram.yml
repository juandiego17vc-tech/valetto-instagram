name: Publicar en Instagram

# Horarios (hora Argentina). Corre cada 15 min y decide solo:
#   10:52 vista previa educativo -> Telegram     11:52 publica educativo
#   17:52 vista previa reloj     -> Telegram     18:52 publica reloj
on:
  schedule:
    - cron: "*/15 * * * *"   # revisa cada 15 min si toca vista previa o publicar
  push:
    paths: ["disparar.txt"]   # tocar este archivo hace correr el sistema al instante
  workflow_dispatch:
    inputs:
      tipo:
        description: "¿Qué?"
        type: choice
        options: [reloj, educativo]
        default: reloj
      accion:
        description: "¿Qué hacer?"
        type: choice
        options: [prueba, auto, vista_previa, publicar, probar_buffer]
        default: prueba

permissions:
  contents: write

concurrency: publicar-instagram

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Leer acción pedida (si se disparó tocando disparar.txt)
        if: github.event_name == 'push'
        run: |
          A=$(head -1 disparar.txt | awk '{print $1}')
          case "$A" in prueba|vista_previa|publicar|probar_buffer) echo "ACCION_PUSH=$A" >> $GITHUB_ENV ;; esac
          T=$(head -1 disparar.txt | awk '{print $2}')
          case "$T" in reloj|educativo) echo "TIPO_PUSH=$T" >> $GITHUB_ENV ;; esac

      - name: Correr
        run: |
          if [ -n "$ACCION_PUSH" ]; then export ACCION="$ACCION_PUSH"; fi
          if [ -n "$TIPO_PUSH" ]; then export TIPO="$TIPO_PUSH"; fi
          node publicar.mjs
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '8634273911' }}
          TIPO: ${{ inputs.tipo || 'reloj' }}
          ACCION: ${{ github.event_name == 'workflow_dispatch' && inputs.accion || 'auto' }}

      - name: Guardar historial (para no repetir)
        run: |
          git config user.name "valetto-bot"
          git config user.email "valetto-bot@users.noreply.github.com"
          for f in registro.txt ultimo-error.txt estado.json posted.json posted-edu.json pendiente-reloj.json pendiente-educativo.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || (git commit -m "Publicación $(date +%F)" && git pull --rebase && git push)
